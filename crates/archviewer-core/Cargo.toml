[package]
name = "archviewer-core"
version = "0.1.0"
edition = "2021"

[dependencies]
globset = "0.4.21"
json-strip-comments = "3.1.2"
oxc_allocator = "0.157.0"
oxc_ast = "0.157.0"
oxc_ast_visit = "0.157.0"
oxc_parser = "0.157.0"
oxc_resolver = "11.24.3"
oxc_span = "0.157.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tsify = { version = "0.5.8", default-features = false, features = ["js"], optional = true }
wasm-bindgen = { version = "=0.2.130", optional = true }

[features]
wasm = ["dep:tsify", "dep:wasm-bindgen"]

[dev-dependencies]
insta = { version = "1.49.0", features = ["json"] }
