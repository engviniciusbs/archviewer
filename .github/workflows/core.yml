name: core

on:
  push:
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Core tests (wasm feature off)
        run: cargo test -p archviewer-core
      - name: Workspace tests
        run: cargo test --workspace

      - name: Perf check (20k files)
        run: cargo test -p archviewer-core --release --test perf -- --ignored

      - name: Resolve wasm-bindgen version from Cargo.lock
        id: wb
        run: |
          v=$(awk '/^name = "wasm-bindgen"$/ {getline; gsub(/version = |"/, ""); print; exit}' Cargo.lock)
          test -n "$v"
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - uses: taiki-e/install-action@v2
        with:
          tool: "wasm-bindgen-cli@${{ steps.wb.outputs.version }}"

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build and test core-wasm
        run: pnpm --filter @archviewer/core-wasm build && pnpm --filter @archviewer/core-wasm test
