[package]
name = "archviewer-core-wasm"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
archviewer-core = { path = "../../crates/archviewer-core", features = ["wasm"] }
console_error_panic_hook = "0.1.7"
serde = "1.0.229"
serde-wasm-bindgen = "0.6.5"
tsify = { version = "0.5.8", features = ["js"] }
wasm-bindgen = "=0.2.130"
